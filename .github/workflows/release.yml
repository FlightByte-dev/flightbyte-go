# Releases a version when a tag like v1.0.1 is pushed:
#   1. checks that the tag matches Version in version.go and that
#      CHANGELOG.md has a section for the version, then runs the tests;
#   2. creates the GitHub release from the version's CHANGELOG.md section;
#   3. once the repository is public, asks the Go module proxy to fetch the
#      version, so it shows up on pkg.go.dev without waiting for a user.
#
# A Go module is released by its tag; there is nothing to upload.
#
# Run it by hand from the Actions tab to rehearse: it runs every check and
# the tests, but releases nothing.
name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Check version, notes and tests
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - id: version
        name: Compare versions
        run: |
          version="$(sed -n 's/^const Version = "\(.*\)"$/\1/p' version.go)"
          if [[ -z "$version" ]]; then
            echo "::error::version.go has no Version constant."
            exit 1
          fi
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Version $version in version.go."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version $version"

      - name: Release notes
        run: |
          {
            echo "## Release notes for ${{ steps.version.outputs.version }}"
            echo
            tool/release_notes.sh "${{ steps.version.outputs.version }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - run: go vet ./...
      - run: go test -race ./...

  release:
    name: GitHub release
    needs: check
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists."
            exit 0
          fi
          tool/release_notes.sh "$VERSION" > "$RUNNER_TEMP/notes.md"
          flags=()
          [[ "$VERSION" == *-* ]] && flags+=(--prerelease)
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --verify-tag \
            "${flags[@]}"

  proxy:
    name: Go module proxy
    needs: release
    # The proxy cannot fetch a private repository.
    if: github.event_name == 'push' && github.event.repository.private == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - name: Ask the proxy to fetch the version
        working-directory: ${{ runner.temp }}
        env:
          GOPROXY: https://proxy.golang.org
        run: go list -m "github.com/${GITHUB_REPOSITORY}@${GITHUB_REF_NAME}"
