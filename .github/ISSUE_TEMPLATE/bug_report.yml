name: Bug report
description: Something in the package does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. A question about the API itself, your plan or a flight's data is answered faster on [Telegram](https://t.me/flightbyte). A security issue goes by email, as [SECURITY.md](https://github.com/FlightByte-dev/flightbyte-go/security/policy) explains, never here.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: code
    attributes:
      label: Code that shows it
      description: The smallest snippet that reproduces it, and the full error or panic.
      render: go
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Module version
      description: The `github.com/FlightByte-dev/flightbyte-go` line of your `go.mod`.
      placeholder: v0.1.0
    validations:
      required: true
  - type: input
    id: go
    attributes:
      label: Go version
      description: The output of `go version`.
      placeholder: go version go1.26.2 linux/amd64
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Where it runs
      multiple: true
      options:
        - Linux
        - macOS
        - Windows
        - A container or serverless runtime
        - Other
    validations:
      required: true
  - type: input
    id: request-id
    attributes:
      label: Request id
      description: For an error from the API, `APIError.RequestID`. It lets us find the request in our logs.
  - type: checkboxes
    id: secrets
    attributes:
      label: Before you submit
      options:
        - label: I removed every API key and webhook signing secret from this report.
          required: true
